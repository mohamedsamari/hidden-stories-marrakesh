services:
  - type: web
    name: hidden-stories-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: KINDE_DOMAIN
        sync: false
      - key: KINDE_AUDIENCE
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MCP_SERVER_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - type: web
    name: hidden-stories-mcp-server
    runtime: docker
    dockerfilePath: ./mcp-server/Dockerfile
    dockerContext: ./mcp-server
    plan: free
    envVars:
      - key: BACKEND_API_URL
        sync: false
